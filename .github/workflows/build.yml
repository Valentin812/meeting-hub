name: build exe

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    name: MeetingHub.exe + installer (Python 3.12), tested on a virtual sound card
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: LABSN/sound-ci-helpers@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade -r requirements.txt pyinstaller

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name MeetingHub
          --hidden-import audio_check --hidden-import support --hidden-import pyaudiowpatch
          --collect-data soundcard
          --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime
          --hidden-import transcriber --hidden-import pystray._win32
          app.py

      - name: Code signing certificate (optional)
        id: cert
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX_B64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:PFX_B64))
            $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            "signtool=$($tool.FullName)" >> $env:GITHUB_OUTPUT
            "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Output "::notice title=signing::certificate found, binaries will be signed"
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Output "::notice title=signing::no CODESIGN_PFX_BASE64 secret, build is unsigned"
          }

      - name: Sign exe
        if: steps.cert.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: >
          & "${{ steps.cert.outputs.signtool }}" sign /f "$env:RUNNER_TEMP\codesign.pfx" /p "$env:PFX_PASSWORD"
          /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\MeetingHub\MeetingHub.exe

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          & $iscc "/DAppVer=${{ steps.ver.outputs.version }}" packaging\MeetingHub.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          "setup=pkg\MeetingHubSetup-v${{ steps.ver.outputs.version }}.exe" >> $env:GITHUB_ENV

      - name: Sign installer
        if: steps.cert.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: >
          & "${{ steps.cert.outputs.signtool }}" sign /f "$env:RUNNER_TEMP\codesign.pfx" /p "$env:PFX_PASSWORD"
          /fd sha256 /tr http://timestamp.digicert.com /td sha256 $env:setup

      - name: Portable ZIP
        shell: pwsh
        run: |
          $name = "MeetingHub-v${{ steps.ver.outputs.version }}-portable"
          $dst = "pkg\$name"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse dist\MeetingHub\* $dst
          Copy-Item packaging\README_EXE.txt "$dst\ПРОЧТИ_МЕНЯ.txt"
          Copy-Item packaging\audio_check.bat, packaging\setup_ollama.bat, README.txt, CHANGELOG.md, MANUAL_TEST.txt $dst
          "Портативный режим: данные хранятся в этой папке рядом с MeetingHub.exe." | Out-File "$dst\portable.txt" -Encoding utf8
          Compress-Archive -Path $dst -DestinationPath "pkg\$name.zip"
          "portable=pkg\$name.zip" >> $env:GITHUB_ENV

      - name: Test - silent install for the current user
        timeout-minutes: 5
        shell: pwsh
        run: |
          Start-Process -FilePath $env:setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$env:RUNNER_TEMP\setup.log" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Meeting Hub\MeetingHub.exe"
          if (-not (Test-Path $exe)) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "not installed: $exe" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "Meeting Hub*.lnk"
          Write-Output "::notice title=installer::installed to $exe; start menu shortcuts: $($lnk.Count)"
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue)."Meeting Hub"
          if ($run -notmatch '--minimized') { throw "autostart was not registered: $run" }
          Write-Output "::notice title=autostart::$run"

      - name: Test - installed app checks sound and records 4 s while a tone plays
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\Meeting Hub\MeetingHub.exe"
          $data = "$env:LOCALAPPDATA\Meeting Hub"
          Start-Process -FilePath $exe -ArgumentList "--audio-check" -Wait
          $r = Get-Content "$data\meeting_hub_audio_report.txt" -Encoding utf8
          $ok = ($r | Select-String '^\s*OK').Count
          Write-Output "::notice title=exe audio_check::OK=$ok"
          if ($ok -lt 1) { throw "installed exe could not open any audio device" }
          $tone = Start-Process -FilePath python -ArgumentList "tests\play_tone.py", "15" -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          Start-Process -FilePath $exe -ArgumentList "--record-test", "4" -Wait
          Stop-Process -Id $tone.Id -ErrorAction SilentlyContinue
          $j = Get-Content "$data\record_test.json" -Encoding utf8 | ConvertFrom-Json
          Write-Output "::notice title=exe record_test::duration=$($j.duration) system_peak=$($j.system_peak)"
          if ($j.system_peak -lt 1000) { throw "computer sound was not recorded" }
          if ([math]::Abs($j.duration - 4) -gt 0.5) { throw "wrong duration" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\Meeting Hub\recordings") { throw "data written next to the program instead of the user profile" }

      - name: Test - installed app transcribes speech (tiny model, synthesized voice)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\Meeting Hub\MeetingHub.exe"
          Add-Type -AssemblyName System.Speech
          $wav = Join-Path $env:RUNNER_TEMP "speech.wav"
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $s.SetOutputToWaveFile($wav, $fmt)
          $s.Speak("Hello everyone. This is a test of the meeting transcription. We will ship the new version on Friday.")
          $s.Dispose()
          Start-Process -FilePath $exe -ArgumentList "--transcribe", $wav, "tiny", "en" -Wait
          $txt = Get-Content (Join-Path $env:RUNNER_TEMP "speech.txt") -Encoding utf8 -Raw
          Write-Output "::notice title=transcript::$($txt -replace '\s+',' ')"
          if ($txt -notmatch '(?i)transcription|friday|version') { throw "speech was not recognized" }
          $proto = Join-Path $env:RUNNER_TEMP "speech.protocol.html"
          if (-not (Test-Path $proto)) { throw "protocol was not created" }
          if ((Get-Content $proto -Encoding utf8 -Raw) -notmatch '(?i)transcription|friday|version') { throw "protocol has no transcript" }

      - name: Test - GUI starts, imports data of an old version placed next to the exe
        timeout-minutes: 5
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Meeting Hub"
          $data = "$env:LOCALAPPDATA\Meeting Hub"
          Remove-Item "$data\meeting_hub_training*.json" -ErrorAction SilentlyContinue
          Copy-Item tests\data\meeting_hub_training_v49.json "$app\meeting_hub_training.json"
          $p = Start-Process -FilePath "$app\MeetingHub.exe" -PassThru
          $deadline = (Get-Date).AddSeconds(40)
          while (-not (Test-Path "$data\meeting_hub.log") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "MeetingHub.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          if (-not (Test-Path "$data\meeting_hub.log")) { throw "no log in the user data folder" }
          if (-not (Test-Path "$data\meeting_hub_training.json")) { throw "old data was not imported" }
          if (-not (Get-ChildItem "$data\meeting_hub_training.v4-backup-*.json")) { throw "v4.9 data was not migrated" }
          Write-Output "::notice title=exe gui::started; old data imported into the profile and migrated"

      - name: Test - autostart launch runs hidden in the tray and keeps running
        timeout-minutes: 3
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Meeting Hub"
          $p = Start-Process -FilePath "$app\MeetingHub.exe" -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "MeetingHub.exe --minimized exited with code $($p.ExitCode)" }
          $p.Refresh()
          Write-Output "::notice title=minimized::running, main window handle=$($p.MainWindowHandle)"
          Stop-Process -Id $p.Id

      - name: Test - upgrade over the installed version and uninstall keeps user data
        timeout-minutes: 5
        shell: pwsh
        run: |
          Start-Process -FilePath $env:setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\Meeting Hub"
          if (-not (Test-Path "$app\MeetingHub.exe")) { throw "upgrade broke the installation" }
          Start-Process -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$app\MeetingHub.exe") { throw "program not removed" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Meeting Hub\meeting_hub_training.json")) { throw "user data lost on uninstall" }
          if (-not (Get-ChildItem "$env:LOCALAPPDATA\Meeting Hub\recordings\*.wav")) { throw "recordings lost on uninstall" }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue)."Meeting Hub") { throw "autostart left after uninstall" }
          Write-Output "::notice title=installer upgrade/uninstall::program removed, user data kept"

      - name: Publish as GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $signed = "${{ steps.cert.outputs.enabled }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --target $env:GITHUB_SHA --title "Meeting Hub $tag" --notes "MeetingHubSetup — установщик (рекомендуется). portable.zip — версия без установки. Подпись: $signed. Сборка из коммита $env:GITHUB_SHA."
          }
          gh release upload $tag $env:setup $env:portable --clobber
