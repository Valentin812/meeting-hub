name: tests

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  logic:
    name: logic (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install numpy
      - name: Syntax
        run: python -m py_compile app.py meeting_detector.py win_signals.py training_store.py recorder.py audio_check.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  windows:
    name: windows smoke (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (as setup.bat does)
        run: python -m pip install --upgrade -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Windows API and UI smoke test
        run: python tests/smoke_windows.py

  audio:
    name: real audio device (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: LABSN/sound-ci-helpers@v1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (as setup.bat does)
        run: python -m pip install --upgrade -r requirements.txt
      - name: Record from a virtual sound card
        run: python tests/audio_probe.py
      - name: Probe PyAudioWPatch
        continue-on-error: true
        run: |
          python -m pip install pyaudiowpatch
          python tests/pawp_probe.py
      - name: Detailed audio check script (audio_check.py)
        shell: pwsh
        run: |
          python audio_check.py
          $r = Get-Content meeting_hub_audio_report.txt -Encoding utf8
          $ok = ($r | Select-String ': OK').Count
          $err = ($r | Select-String 'ОШИБКА').Count
          Write-Output "::notice title=audio_check::OK=$ok ОШИБКА=$err"
          if ($ok -lt 1) { throw "audio_check.py did not open any device" }
      - name: PyAudioWPatch probe
        timeout-minutes: 3
        run: |
          python -m pip install PyAudioWPatch
          python tests/pa_probe.py
