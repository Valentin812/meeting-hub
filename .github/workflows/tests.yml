name: tests

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  logic:
    name: logic (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install numpy python-docx
      - name: Syntax
        run: python -m py_compile app.py meeting_detector.py win_signals.py training_store.py recorder.py audio_check.py support.py transcriber.py analyzer.py report.py daily.py tray.py theme.py ui_main.py widgets.py player.py updater.py importer.py salute.py voices.py ui_voices.py chat.py ui_chat.py ai_setup.py ui_ai.py gigachat.py gigaam.py launcher.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  windows:
    name: windows smoke (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (as setup.bat does)
        run: python -m pip install --upgrade -r requirements.txt
      - name: Unit tests
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath ut.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $t = (Get-Content ut.txt -Encoding utf8 -Raw)
            $i = $t.IndexOf("======")
            $msg = $t.Substring([Math]::Max(0, $i)).Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
            Write-Output "::error title=unit tests::$($msg.Substring(0, [Math]::Min(6000, $msg.Length)))"
            exit 1
          }
      - name: Windows API and UI smoke test
        run: python tests/smoke_windows.py
      - name: Voices on the real model (two synthesized voices)
        if: matrix.python == '3.12'
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
        run: |
          try { gh api repos/k2-fsa/sherpa-onnx/releases/tags/speaker-recongition-models --jq '[.assets[].name]|join(" ")' | ForEach-Object { Write-Output "::notice title=speaker models::$_" } } catch { Write-Output "assets list unavailable" }
          Add-Type -AssemblyName System.Speech
          $dir = Join-Path $env:RUNNER_TEMP "voices"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $installed = $s.GetInstalledVoices() | Where-Object { $_.Enabled } | ForEach-Object { $_.VoiceInfo }
          Write-Output "::notice title=tts voices::$(($installed | ForEach-Object { $_.Name + '/' + $_.Gender }) -join ', ')"
          $male = $installed | Where-Object { $_.Gender -eq "Male" } | Select-Object -First 1
          $female = $installed | Where-Object { $_.Gender -eq "Female" } | Select-Object -First 1
          if (-not $male -or -not $female) { throw "need a male and a female voice" }
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $text = @(
            "Good morning everyone. Today we will review the project plan and the schedule for the next quarter. Please share your updates one by one.",
            "Thank you. From my side the design work is almost finished and we are waiting for the final feedback from the customer before the release.",
            "I have two questions about the budget and the deadlines. We need to decide who will prepare the documents and who will send them to the partners."
          )
          foreach ($pair in @(@("v1", $male), @("v2", $female))) {
            for ($i = 1; $i -le 3; $i++) {
              $s.SelectVoice($pair[1].Name)
              $s.SetOutputToWaveFile((Join-Path $dir "$($pair[0])_$i.wav"), $fmt)
              $s.Speak($text[$i - 1])
              $s.SetOutputToNull()
            }
          }
          $s.Dispose()
          python tests/voices_real.py $dir

  audio:
    name: real audio device (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: LABSN/sound-ci-helpers@v1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (as setup.bat does)
        run: python -m pip install --upgrade -r requirements.txt
      - name: Record from a virtual sound card
        run: python tests/audio_probe.py
      - name: Detailed audio check script (audio_check.py)
        shell: pwsh
        run: |
          python audio_check.py
          $r = Get-Content meeting_hub_audio_report.txt -Encoding utf8
          $ok = ($r | Select-String '^\s*(\[поток\]\s*)?OK').Count
          $err = ($r | Select-String 'ОШИБКА').Count
          Write-Output "::notice title=audio_check::OK=$ok ОШИБКА=$err"
          if ($ok -lt 1) { throw "audio_check.py did not open any device" }
      - name: PyAudioWPatch probe
        timeout-minutes: 3
        run: |
          python -m pip install PyAudioWPatch
          python tests/pa_probe.py
