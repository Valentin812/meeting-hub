name: Meeting Hub Windows Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --windowed --name MeetingHub --collect-all faster_whisper --collect-all ctranslate2 app.py
      - name: Create installer
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $iscc = Get-ChildItem 'C:\Program Files*' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe not found' }
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          @'
          [Setup]
          AppName=Meeting Hub
          AppVersion=1.0.0
          DefaultDirName={localappdata}ProgramsMeeting Hub
          OutputDir=installer
          OutputBaseFilename=MeetingHubSetup
          PrivilegesRequired=lowest
          Uninstallable=yes
          [Files]
          Source: "distMeetingHub*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autodesktop}Meeting Hub"; Filename: "{app}MeetingHub.exe"
          Name: "{group}Meeting Hub"; Filename: "{app}MeetingHub.exe"
          [Run]
          Filename: "{app}MeetingHub.exe"; Description: "Запустить Meeting Hub"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content installerMeetingHub.iss -Encoding UTF8
          & $iscc.Source installerMeetingHub.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MeetingHub-Windows-Installer
          path: installerMeetingHubSetup.exe
