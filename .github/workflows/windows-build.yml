name: Meeting Hub Windows Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --windowed --name MeetingHub --collect-all faster_whisper --collect-all ctranslate2 --collect-all PIL --hidden-import PIL._imaging app.py
      - name: Create installer
        shell: pwsh
        run: |
          $isccPath = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $isccPath) {
            $candidates = @(
              'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
              'C:\Program Files\Inno Setup 6\ISCC.exe'
            )
            $isccPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $isccPath) { throw 'ISCC.exe not found' }
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          @'
          [Setup]
          AppName=Meeting Hub
          AppVersion=1.1.29
          DefaultDirName={localappdata}\Programs\Meeting Hub
          OutputDir=.
          OutputBaseFilename=MeetingHubSetup
          PrivilegesRequired=lowest
          Uninstallable=yes
          [Files]
          Source: "..\dist\MeetingHub\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          Source: "..\bootstrap_ai.ps1"; DestDir: "{app}"; Flags: ignoreversion
          [Code]
          function PrepareToInstall(var NeedsRestart: Boolean): String;
          var
            ResultCode: Integer;
          begin
            Result := '';
            Exec(ExpandConstant('{cmd}'), '/C taskkill /IM MeetingHub.exe /F /T', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
            Sleep(1000);
          end;
          [Icons]
          Name: "{autodesktop}\Meeting Hub"; Filename: "{app}\MeetingHub.exe"
          Name: "{group}\Meeting Hub"; Filename: "{app}\MeetingHub.exe"
          [Run]
          Filename: "powershell.exe"; Parameters: "-NoProfile -ExecutionPolicy Bypass -File ""{app}\bootstrap_ai.ps1"""; Description: "Preparing local AI (first install may take a few minutes)"; Flags: runhidden postinstall waituntilterminated
          Filename: "{app}\MeetingHub.exe"; Description: "Launch Meeting Hub"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content installer\MeetingHub.iss -Encoding UTF8
          Push-Location installer
          & $isccPath MeetingHub.iss
          Pop-Location
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MeetingHub-Windows-Installer
          path: installer\MeetingHubSetup.exe
